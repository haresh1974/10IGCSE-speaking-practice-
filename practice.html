<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Speaking Practice Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root {
  --bg: #f3f5fb; --paper: #ffffff; --ink: #18264a; --ink-2: #56627f; --line: #d6ddee;
  --blue: #2c52c4; --blue-ink: #ffffff; --blue-soft: #e4ebff;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1526; --paper: #172038; --ink: #e8edf9; --ink-2: #9aa6c4; --line: #2a3556;
    --blue: #8aa5ff; --blue-ink: #0f1526; --blue-soft: #202d59; --red: #ff7081;
    --good: #55d696; --good-soft: #12372a; --bad: #ff7c88; --bad-soft: #3d1b22; --warn: #f2b866; --warn-soft: #3a2c10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1526; --paper: #172038; --ink: #e8edf9; --ink-2: #9aa6c4; --line: #2a3556;
  --blue: #8aa5ff; --blue-ink: #0f1526; --blue-soft: #202d59; --red: #ff7081;
  --good: #55d696; --good-soft: #12372a; --bad: #ff7c88; --bad-soft: #3d1b22; --warn: #f2b866; --warn-soft: #3a2c10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.in { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font-family: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }

.brand { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; color: var(--blue); }

.home { margin-left: auto; }

.lede { color: var(--ink-2); max-width: 64ch; }

.notice { padding: .7rem .9rem; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.small { font-size: .9rem; color: var(--ink-2); }
.fb { font-weight: 700; } .fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
.zone { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.btn { min-height: 46px; padding: .65rem 1.2rem; border-radius: 10px; border: 2px solid var(--blue); background: var(--blue); color: var(--blue-ink); font-weight: 700; font-size: 1rem; cursor: pointer; }

.toggle { min-height: 40px; padding: .4rem .9rem; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; cursor: pointer; font-size: .95rem; }

.actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.modes { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.mode { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; cursor: pointer; color: var(--ink); display: grid; gap: .3rem; }
.mode:hover { border-color: var(--blue); }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.grid { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.pick { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: .55rem .75rem; cursor: pointer; color: var(--ink); display: grid; gap: .1rem; font-size: .95rem; }
.pick:hover { border-color: var(--blue); }
.pick[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }

.pick span { color: var(--ink-2); font-size: .88rem; }

.phase { display: inline-block; padding: .15rem .75rem; border-radius: 999px; font-weight: 700; font-size: .9rem; background: var(--blue-soft); color: var(--blue); width: fit-content; }
.phase.rec { background: var(--bad-soft); color: var(--bad); }
.meter { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--good); transition: width .08s linear; }
.clocks { display: grid; gap: .6rem; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.clock { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .8rem; display: grid; gap: .1rem; background: var(--bg); }
.clock .lbl { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.clock .val { font-family: var(--f-display); font-weight: 600; font-size: 1.8rem; font-variant-numeric: tabular-nums; color: var(--blue); }
.goal { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
.goal i { display: block; height: 100%; width: 0; background: var(--blue); }
.goal.hit i { background: var(--good); }
.rules { margin: 0; padding-left: 1.25rem; display: grid; gap: .3rem; }
.ans { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; display: grid; gap: .35rem; }
.ahead { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; align-items: baseline; }
.ans audio { width: 100%; max-width: 26rem; }
.anslist { display: grid; gap: .6rem; }
.markrow { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
select, input[type=text] { font: inherit; padding: .45rem .6rem; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
input[type=range] { width: 100%; max-width: 360px; }

table.t { border-collapse: collapse; width: 100%; font-size: .92rem; margin-top: .5rem; }
.t th, .t td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.big-total { font-family: var(--f-display); font-size: 1.6rem; color: var(--blue); }
@media (max-width: 600px) { .bar { position: static; } .clock .val { font-size: 1.4rem; } .clock { padding: .5rem .6rem; } }
</style></head><body>

<header class="bar"><div class="in">
  <div class="brand">Speaking Practice Box<small>Learn French with Haresh Sir</small></div>
  <button class="toggle home" type="button" id="homebtn" hidden>Home</button>
</div></header>
<main class="in" id="main"></main>

<script src="hub_index.js"></script>
<script src="hub_fixed.js"></script>
<script src="hub_themes.js"></script>
<script src="lame.min.js"></script>
<script>
(function () {
'use strict';
var IDX = window.HUB_INDEX || [], FIX = window.HUB_FIXED || {}, TH = window.HUB_THEMES || [];
var framed = false;
try { framed = window.top !== window.self; } catch (e) { framed = true; }
var RP_GOAL = 120, RP_CAP = 180, TH_GOAL = 240, TH_CAP = 260, EXTRA_BELOW = 210;
var SIL_WARN = 10000, SIL_STOP = 16000;
var WHYRE = /parce\s*qu|\bcar\b|puisque|à cause|c['’]est pour|pour que|grâce à/i;
var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var TL = { 1: 'Voyages et transports', 2: 'Transports et voyages', 3: 'Voyages et transports (3)', 4: 'Les transports', 5: 'Communication et technologie (1)', 6: 'Communication et technologie (2)', 7: 'Communication et technologie (3)', 8: 'Communication et technologie (4)', 9: 'Le monde naturel et l’environnement', 10: 'L’éducation', 11: 'Le monde naturel (2)', 12: 'Environnement 1', 13: 'Environnement 2', 14: 'Environnement 3', 15: 'Environnement 4', 16: 'Environnement 5' };

function $(s) { return document.querySelector(s); }
function E(tag, attrs) {
  var e = document.createElement(tag), a = attrs || {};
  Object.keys(a).forEach(function (k) {
    var v = a[k];
    if (v === false || v == null) return;
    if (k === 'class') e.className = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

  for (var i = 2; i < arguments.length; i++) {
    var kids = [].concat(arguments[i]);
    for (var j = 0; j < kids.length; j++) { var kid = kids[j]; if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  }
  return e;
}
function fmt(s) { s = Math.max(0, Math.floor(s)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function yieldUi() { return new Promise(function (r) { setTimeout(r, 0); }); }

/* ---------- state ---------- */
var S = { screen: 'home', mode: null, series: IDX.length ? IDX[0].series : '', rp: null, ths: [], showFr: true, showEn: false, name: '' };
var R = null;   /* the running or finished session */
var M = { state: 'idle', mode: '', msg: '', stream: null, ctx: null, an: null, buf: null, thr: 0.01, floor: 0 };
var seriesLoaded = {};

function loadSeries(ser) {
  window.HUB_RP = window.HUB_RP || {};
  if (window.HUB_RP[ser]) return Promise.resolve(window.HUB_RP[ser]);
  if (seriesLoaded[ser]) return seriesLoaded[ser];
  var fn = 'hub_rp_' + ser.replace('/', '').replace(' ', '_') + '.js';
  seriesLoaded[ser] = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = fn;
    s.onload = function () { window.HUB_RP[ser] ? res(window.HUB_RP[ser]) : rej(new Error('missing data')); };
    s.onerror = function () { delete seriesLoaded[ser]; rej(new Error('could not load ' + fn)); };
    document.head.append(s);
  });
  return seriesLoaded[ser];
}

/* ---------- microphone ---------- */
function rms() {
  if (!M.an) return 0;
  M.an.getFloatTimeDomainData(M.buf);
  var s = 0;
  for (var i = 0; i < M.buf.length; i++) s += M.buf[i] * M.buf[i];
  return Math.sqrt(s / M.buf.length);
}
function meter(v) { var m = document.getElementById('meter-fill'); if (m) m.style.width = Math.min(100, v * 350) + '%'; }
function sampleLevels(ms) {
  return new Promise(function (res) {
    var out = [], t0 = performance.now(), id = setInterval(function () {
      var v = rms(); out.push(v); meter(v);
      if (performance.now() - t0 >= ms) { clearInterval(id); res(out); }
    }, 50);
  });
}
function pct(arr, p) { var a = arr.slice().sort(function (x, y) { return x - y; }); return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : 0; }
function stopStream() {
  if (M.stream) { M.stream.getTracks().forEach(function (t) { t.stop(); }); M.stream = null; }
  if (M.ctx) { try { M.ctx.close(); } catch (e) { /* ignore */ } M.ctx = null; }
  M.an = null;
}
async function micCheck() {
  if (framed) { M.state = 'blocked'; M.msg = 'The microphone is blocked inside this shared preview. Open the teacher’s own link (it starts with https://) to record.'; draw(); return; }
  if (!window.isSecureContext || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    M.state = 'blocked';
    M.msg = window.isSecureContext === false ? 'The microphone only works on a safe web link. This page was opened as a file. Please open the link your teacher sent (it starts with https://).' : 'This browser cannot use the microphone. Try Chrome or Safari.';
    draw(); return;
  }
  stopStream();
  M.state = 'asking'; M.msg = ''; draw();
  try { M.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) {
    M.stream = null; M.state = 'blocked';
    var nm = e && e.name;
    M.msg = (nm === 'NotAllowedError' || nm === 'SecurityError') ? 'The microphone is blocked. Allow it for this page (tap the lock icon next to the web address, or on iPad: Settings, Safari, Microphone), then press Check again.'
      : nm === 'NotFoundError' ? 'No microphone was found on this device.'
      : nm === 'NotReadableError' ? 'Another app is using the microphone. Close it and press Check again.'
      : 'The microphone could not be started.';
    draw(); return;
  }
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    M.ctx = new AC();
    if (M.ctx.resume) await M.ctx.resume();
    M.an = M.ctx.createAnalyser(); M.an.fftSize = 1024;
    M.buf = new Float32Array(M.an.fftSize);
    M.ctx.createMediaStreamSource(M.stream).connect(M.an);
  } catch (e2) { M.state = 'blocked'; M.msg = 'The microphone could not be started.'; draw(); return; }
  M.state = 'floor'; draw();
  var quiet = await sampleLevels(1200);
  M.floor = pct(quiet, 0.5);
  M.state = 'speak'; draw();
  var talk = await sampleLevels(3200);
  var level = pct(talk, 0.9);
  var thr = Math.max(0.006, M.floor * 2.5);
  if (level < thr * 1.6) { M.state = 'weak'; thr = Math.max(0.003, Math.min(thr, level * 0.4)); }

}
function skipMic() { stopStream(); M.state = 'skip'; M.mode = 'timer'; draw(); }
function pickMime() {
  var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (var i = 0; i < c.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i];
  return '';
}

/* ---------- plan ---------- */
function themeObj(n) { return TH.filter(function (t) { return t.n === n; })[0]; }
function cardMeta(sel) { var s = IDX.filter(function (x) { return x.series === sel.series; })[0]; return s ? { s: s, c: s.cards.filter(function (c) { return c.n === sel.n; })[0] } : null; }
function planReady() {
  if (S.mode === 'rp') return !!S.rp;
  if (S.mode === 'theme') return S.ths.length === 1;
  return !!S.rp && S.ths.length === 2;
}
function buildPlan() {
  var plan = [];
  if (S.rp && (S.mode === 'rp' || S.mode === 'exam')) plan.push({ type: 'rp', sel: S.rp });
  if (S.mode === 'theme' || S.mode === 'exam') S.ths.forEach(function (n, i) { plan.push({ type: 'th', n: n, which: i + 1 }); });
  return plan;
}
function segLabel(p) {
  if (p.type === 'rp') { var m = cardMeta(p.sel); return 'Role play · ' + m.s.label + ' · Card ' + p.sel.n; }
  return 'Topic conversation · Speaking ' + p.n + ' · ' + TL[p.n];
}

/* ---------- audio playback ---------- */
var tok = 0;
function stopAudio() { tok++; if (R && R.aud) { try { R.aud.pause(); } catch (e) { /* ignore */ } R.aud = null; } }
function playSeq(list, done) {
  var my = ++tok, i = 0;
  function next() {
    if (my !== tok) return;
    if (i >= list.length) { done(); return; }
    var a = new Audio(list[i++]); R.aud = a;
    var fired = false;
    function go() { if (fired) return; fired = true; if (my !== tok) return; setTimeout(next, i >= list.length ? 0 : 500); }
    a.addEventListener('ended', go); a.addEventListener('error', go);
    var pr = a.play(); if (pr && pr.catch) pr.catch(go);
  }
  next();
}

/* ---------- reason (Pourquoi) sensing ---------- */
function isWhyPr(p) { return !!p && /pourquoi/i.test(p.fr || ''); }
function whyNeeded() {
  var G = R.G, c = G.it; if (!c || c.kind === 'x') return false;
  if (isWhyPr(c)) return true;
  var nx = G.items[G.i + 1]; return !!(nx && nx.qn === c.qn && nx.kind === c.kind && isWhyPr(nx));
}
function startWhy(turn) {
  if (M.mode !== 'mic' || IOS || !turn || turn.asrFail) return;
  var SRC = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SRC) return;
  try {
    var r = new SRC(); r.lang = 'fr-FR'; r.continuous = true; r.interimResults = true;
    r.onresult = function (e) { var t = ''; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' '; turn.heard = t; if (WHYRE.test(t)) turn.why = true; };
    r.onerror = function (e) { if (e && /not-allowed|service-not-allowed|audio-capture/.test(e.error || '')) turn.asrFail = true; };
    r.onend = function () { if (!turn.asrStop && !turn.asrFail && R && R.G && R.G.turn === turn && R.G.state === 'answering') { try { r.start(); } catch (x) { /* ignore */ } } };
    turn.asrStop = false; turn.asr = r; r.start(); turn.asrOn = true;
  } catch (e) { turn.asr = null; turn.asrFail = true; }
}
function stopWhy(turn) { if (turn && turn.asr) { turn.asrStop = true; try { turn.asr.stop(); } catch (e) { /* ignore */ } turn.asr = null; } }
function whyTick(turn) {
  var G = R.G, el = document.getElementById('why-live'); if (!el) return;
  var msg = '', ok = false;
  if (whyNeeded()) {
    if (!turn.why && !turn.asrOn && isWhyPr(G.it) && turn.voiced >= 6) turn.whyProb = true;
    if (turn.why) { msg = '✓ Reason heard. Well done!'; ok = true; G.whySeen[G.it.qn] = true; }
    else if (turn.whyProb) { msg = '✓ Reason probably given. Well done!'; ok = true; }
    else if (isWhyPr(G.it) && G.whySeen[G.it.qn]) { msg = '✓ You already gave a reason earlier. Add one more detail.'; ok = true; }
    else if (isWhyPr(G.it) && turn.voiced > 8) msg = 'Do not forget to say why: « Parce que… » or « Car… ».';
  }
  if (msg) { el.textContent = msg; el.style.display = ''; el.style.borderColor = ok ? '#2e7d32' : ''; } else el.style.display = 'none';
}
function whyLabel(r) {
  var s = '';
  if (!r.whyReq || !isWhyPr(r.it)) return s;
  if (r.why) s += ' · reason heard ✓';
  else s += r.whyProb ? ' · reason probably given' : (r.whyEarly ? ' · reason given earlier' : ' · reason not heard');
  return s;
}

/* ---------- running a segment ---------- */
function startSession() {
  R = { plan: buildPlan(), si: 0, segs: [], screen: 'run', mp3: null, marks: { rp: [null, null, null, null, null], c: null, l: null }, G: null, aud: null };
  S.screen = 'run';
  beginSegment();
}
async function beginSegment() {
  var p = R.plan[R.si], G = { p: p, state: 'loading', items: [], i: 0, sum: 0, extraN: 0, turn: null, raf: 0, whySeen: {}, capped: false, results: [], pre: [], goal: 0, cap: 0, qSrc: '', extras: [] };
  R.G = G; R.screen = 'run'; draw();
  try {
    if (p.type === 'rp') {
      var arr = await loadSeries(p.sel.series), card = arr.filter(function (c) { return c.n === p.sel.n; })[0];
      G.card = card; G.goal = RP_GOAL; G.cap = RP_CAP;
      G.pre = [FIX.greet, card.scenSrc];
      card.q.forEach(function (parts, qi) { parts.forEach(function (pt, pi) { G.items.push({ kind: 'rp', qn: qi + 1, part: pi, parts: parts.length, fr: pt.fr, en: '', src: pt.src, altSrc: '' }); }); });
    } else {
      var th = themeObj(p.n); G.th = th; G.goal = TH_GOAL; G.cap = TH_CAP;
      G.pre = [];
      if (R.si > 0 && R.plan[R.si - 1].type === 'rp') G.pre.push(FIX.rpEnd);
      G.pre.push(p.which === 2 ? th.intro2 : th.intro1);
      th.prompts.forEach(function (q) { G.items.push({ kind: 'th', qn: parseInt(q.q.slice(1), 10), part: q.part, parts: 0, fr: q.fr, en: q.en, src: q.src, altFr: q.altFr, altEn: q.altEn, altSrc: q.altSrc }); });
      G.extras = th.extras.slice();
    }
  } catch (e) { G.state = 'error'; G.err = e.message; draw(); return; }
  G.items.forEach(function (it) { it.parts = G.items.filter(function (x) { return x.qn === it.qn; }).length; });
  G.state = 'intro'; draw();
  var seq = G.pre.filter(Boolean);
  playSeq(seq, function () { beginItem(); });
}
function beginItem() {
  var G = R.G; G.it = G.items[G.i]; G.it.stage = 'o'; G.it.rep = 0; G.turn = null; G.state = 'asking';
  G.qSrc = G.it.src; draw();
  playSeq([G.it.src], startTurn);
}
function canAlt() { var it = R.G.it; return it.kind === 'th' && it.qn >= 3 && !!it.altSrc && it.stage === 'o' && it.rep >= 1; }
